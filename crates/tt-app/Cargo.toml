[package]
name = "tt-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
tt-domain.workspace = true
tt-storage.workspace = true
tt-services.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
serde.workspace = true
serde_json.workspace = true
rfd.workspace = true
# Only the software renderer: no OpenGL driver in the process (docs/perf.md).
slint = { workspace = true, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit-x11",
    "renderer-software",
    "software-renderer-path",
    "unstable-winit-030",
] }
sys-locale.workspace = true
directories.workspace = true
log.workspace = true
simplelog.workspace = true
anyhow.workspace = true
tray-icon.workspace = true
auto-launch.workspace = true

[target.'cfg(windows)'.dependencies]
windows-registry.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build.workspace = true
winresource.workspace = true

[dev-dependencies]
tempfile.workspace = true
