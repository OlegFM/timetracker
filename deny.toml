[graph]
targets = [{ triple = "x86_64-pc-windows-msvc" }]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "OFL-1.1",
    "CC0-1.0",
    "BSL-1.0",
    # webpki-roots (Mozilla's CA list, via ureq for the update check), ruling R19.
    "CDLA-Permissive-2.0",
    # Slint is `GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR ...`;
    # we use the royalty-free option (AboutSlint attribution required).
    "LicenseRef-Slint-Royalty-free-2.0",
]
# Workspace crates are `publish = false`.
private = { ignore = true }

[bans]
multiple-versions = "warn"
