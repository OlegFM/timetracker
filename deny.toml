[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "OFL-1.1",
    "CC0-1.0",
    "BSL-1.0",
    # webpki-roots (Mozilla's CA list, via ureq for the update check), ruling R19.
    "CDLA-Permissive-2.0",
    # Slint is `GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR ...`;
    # we use the royalty-free option (AboutSlint attribution required).
    "LicenseRef-Slint-Royalty-free-2.0",
    # ksni (Linux tray, via tray-icon); public-domain dedication.
    "Unlicense",
]
# Workspace crates are `publish = false`.
private = { ignore = true }

[advisories]
ignore = [
    # Unmaintained, no fix upstream; only `spin_on` in Slint's build-time macros uses it.
    { id = "RUSTSEC-2026-0441", reason = "pin-utils: build-time only, via slint-macros/slint-build" },
    # Linux only; merged into zbus 6 / replaced by skrifa, no fix for the versions locked by
    # winit, accesskit and ksni.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: unmaintained, Linux-only, via winit's sctk-adwaita" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant: unmaintained (merged into zbus 6), Linux-only, via accesskit_unix and ksni" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: unmaintained (merged into zbus 6), Linux-only, via accesskit_unix and ksni" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: unmaintained (merged into zbus 6), Linux-only, via accesskit_unix and ksni" },
]

[bans]
multiple-versions = "warn"
